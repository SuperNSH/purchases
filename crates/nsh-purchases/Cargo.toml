[package]
name = "nsh-purchases"
description = "In-app purchases for Native Shell apps: products, purchases, restores and entitlements over StoreKit 2 and Play Billing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["nshm", "nsh", "in-app-purchases", "storekit", "billing"]

[lib]
name = "nsh_purchases"
path = "src/lib.rs"

[dependencies]
nsh-core = "0.7.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "sync", "time"] }

[dev-dependencies]
nsh-engine = { version = "0.7.1", default-features = false }
nsh-testing = { version = "0.7.1", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "test-util"] }
