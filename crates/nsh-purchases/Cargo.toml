[package]
name = "nsh-purchases"
description = "In-app purchases for Native Shell apps: products, purchases, restores and entitlements over StoreKit 2 and Play Billing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "nsh_purchases"
path = "src/lib.rs"

[dependencies]
nsh-core = "0.4.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "test-util"] }
